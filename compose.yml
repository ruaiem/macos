services:
  macos:
    image: dockurr/macos
    container_name: macos
    environment:
      VERSION: "11"
  RAM_SIZE: "8G"
  CPU_CORES: "4"
  DISK_SIZE: "256G"
  AUDIO: "Y"
  GPU: "Y"
devices:
  - /dev/dri
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 5900:5900/tcp
      - 5900:5900/udp
    volumes:
      - ./macos:/storage
    restart: on-failure
    stop_grace_period: 720m

